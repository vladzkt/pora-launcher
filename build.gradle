// Лаунчер «Пора Копать». Обычное приложение на Java: чем меньше вокруг него слоёв,
// тем меньше поводов не запуститься у человека, который просто хочет поиграть.
plugins {
    id 'application'
}

group = 'ru.mcgl'
version = '1.0.19'

repositories {
    mavenCentral()
}

dependencies {
    // Единственная зависимость: разбор чужого JSON. Свой парсер тут был бы источником ошибок,
    // а формат версий Minecraft меняется от версии к версии.
    implementation 'com.google.code.gson:gson:2.11.0'
}

java {
    // Собираем двадцать первой - она же уедет в готовый exe для Windows.
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// А байткод пишем под семнадцатую.
//
// Это про Мак и Линукс: там Java ставит сам игрок, и в системе чаще всего оказывается 17 - она
// идёт в комплекте со многими программами. Джарник под 21 такая Java не запустит вовсе, и человек
// упрётся в стену ещё до окна лаунчера. Под 17 он запускается, а Java для самой игры (ей нужна 21)
// лаунчер скачивает у Mojang сам - см. Installer.runtime.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

application {
    mainClass = 'ru.mcgl.launcher.Launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Все классы и зависимости одним джарником: так его проще скормить jpackage.
tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    manifest {
        // Версию лаунчер читает у самого себя: по ней он и решает, обновляться ли.
        attributes 'Main-Class': application.mainClass,
                   'Implementation-Version': project.version
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
